<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --sky-top: #0b1c33;
      --sky-mid: #274267;
      --sky-horizon: #7f9dc4;
      --snow: #f4f8fc;
      --ink: #eef4fb;
      --ink-soft: #b6c4da;
      --ink-faint: #8494ad;
      --card-bg: rgba(15, 26, 44, 0.6);
      --card-border: rgba(255, 255, 255, 0.14);
      --field-bg: rgba(255, 255, 255, 0.07);
      --field-border: rgba(255, 255, 255, 0.2);
      --accent: #4bab82;
      --accent-strong: #7fe0b3;
      --focus-ring: #8fd6ff;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      font-family: "Work Sans", -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-horizon) 100%);
      background-attachment: fixed;
    }

    /* ---- the mountain scene: fixed, decorative, behind everything ----
       Hybrid: a real photo for the far background/sky, an illustrated
       near-ridge silhouette in front of it for depth and parallax. ---- */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .photo-bg {
      position: absolute;
      inset: -4%; /* overscan so the Ken Burns zoom never reveals an edge */
      background-image: url('https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Iceland%27s_Mid-Atlantic_Ridge_during_snow.jpg/960px-Iceland%27s_Mid-Atlantic_Ridge_during_snow.jpg');
      background-size: cover;
      background-position: center;
      animation: kenBurns 55s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes kenBurns {
      0%   { transform: scale(1.0) translate(0, 0); }
      50%  { transform: scale(1.08) translate(-1%, -1%); }
      100% { transform: scale(1.0) translate(0, 0); }
    }
    .scene-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(11,28,51,0.6) 0%, rgba(11,28,51,0.15) 38%, rgba(11,28,51,0.35) 70%, rgba(11,28,51,0.8) 100%);
    }
    .mtn {
      position: absolute;
      left: -4%;
      bottom: 0;
      width: 108%;
      display: block;
      will-change: transform;
    }
    #snowCanvas { position: absolute; inset: 0; }

    /* ---- climb marker: today's overall % as a position on the mountain ---- */
    .climb-track {
      position: fixed;
      right: 22px;
      bottom: 10vh;
      width: 2px;
      height: 58vh;
      background: linear-gradient(to top, rgba(255,255,255,0.4), rgba(255,255,255,0));
      z-index: 2;
      pointer-events: none;
    }
    .climb-marker {
      position: absolute;
      left: 50%;
      bottom: 0%;
      font-size: 20px;
      transform: translate(-50%, 55%);
      transition: bottom 0.7s cubic-bezier(.22,.9,.35,1);
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.65));
    }
    @media (max-width: 480px) { .climb-track { display: none; } }

    /* ---- content ---- */
    .content {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }
    .eyebrow {
      font-family: "Work Sans", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    h1 {
      font-family: "Cinzel", Georgia, serif;
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: 0.01em;
      margin: 6px 0 2px;
      color: var(--snow);
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
    .sub { color: var(--ink-soft); margin-top: 2px; font-size: 0.92rem; }

    .card {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(12px) saturate(130%);
      backdrop-filter: blur(12px) saturate(130%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-top: 16px;
      box-shadow: 0 10px 30px rgba(4, 10, 20, 0.35);
    }
    .card h2 {
      font-family: "Work Sans", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 10px;
      color: var(--accent-strong);
    }
    .card.reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .card.reveal.in-view { opacity: 1; transform: translateY(0); }
    @keyframes glowPulse {
      0% { box-shadow: 0 10px 30px rgba(4,10,20,0.35), 0 0 0 rgba(127,224,179,0); }
      35% { box-shadow: 0 10px 30px rgba(4,10,20,0.35), 0 0 28px rgba(127,224,179,0.55); }
      100% { box-shadow: 0 10px 30px rgba(4,10,20,0.35), 0 0 0 rgba(127,224,179,0); }
    }
    .card.glow-pulse { animation: glowPulse 0.9s ease-out; }

    label { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-top: 10px; }
    input[type=number], input[type=text], select {
      width: 100%; padding: 9px 10px; border: 1px solid var(--field-border);
      background: var(--field-bg); color: var(--ink);
      border-radius: 7px; font-size: 1rem; margin-top: 4px;
      font-family: "Work Sans", sans-serif;
    }
    input[type=number] { font-variant-numeric: tabular-nums; }
    input:focus, select:focus {
      outline: none; border-color: var(--focus-ring);
      box-shadow: 0 0 0 3px rgba(143, 214, 255, 0.25);
    }
    input::placeholder { color: var(--ink-faint); }

    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .check input { width: 18px; height: 18px; accent-color: var(--accent); }

    button {
      background: var(--accent); color: #06170f; font-weight: 600; border: none;
      border-radius: 8px; padding: 10px 16px; font-size: 0.95rem; cursor: pointer;
      margin-top: 12px; font-family: "Work Sans", sans-serif;
      box-shadow: 0 4px 16px rgba(75, 171, 130, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(75, 171, 130, 0.45); }
    button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    button.secondary {
      background: rgba(255,255,255,0.1); color: var(--ink);
      box-shadow: none; border: 1px solid var(--field-border);
    }

    .msg { font-weight: 600; color: var(--snow); }
    .progress-bar { background: rgba(255,255,255,0.12); border-radius: 6px; height: 8px; overflow: hidden; margin-top: 6px; }
    .progress-fill { background: linear-gradient(90deg, var(--accent), var(--accent-strong)); height: 100%; transition: width 0.4s ease; }
    .pill {
      display: inline-block; background: rgba(75,171,130,0.18); color: var(--accent-strong);
      border-radius: 12px; padding: 2px 10px; font-size: 0.75rem; font-weight: 500;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 8px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); color: var(--ink-soft); }
    th { color: var(--ink-faint); font-weight: 500; }
    #status { font-size: 0.85rem; color: var(--accent-strong); margin-top: 8px; min-height: 1.2em; transition: opacity 0.3s; }
    #loading { text-align: center; padding: 40px; color: var(--ink-soft); }

    #progressCard .progress-bar { height: 14px; }
    #overallPct {
      font-family: "Cinzel", Georgia, serif;
      font-size: 2.1rem; font-weight: 700; color: var(--accent-strong);
      text-shadow: 0 0 18px rgba(127, 224, 179, 0.35);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { background: rgba(255,255,255,0.08); color: var(--ink-soft); border-radius: 12px; padding: 4px 10px; font-size: 0.78rem; }
    .chip.done { background: var(--accent); color: #06170f; font-weight: 600; }

    /* ---- snow-burst micro interaction ---- */
    .burst-flake {
      position: absolute; pointer-events: none; color: var(--snow);
      font-size: 14px; z-index: 50; animation: burst 0.9s ease-out forwards;
    }
    @keyframes burst {
      0% { transform: translate(0,0) scale(0.6); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card.reveal { opacity: 1; transform: none; transition: none; }
      .climb-marker { transition: none; }
      .photo-bg { animation: none; }
    }
  </style>
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="photo-bg"></div>
    <div class="scene-overlay"></div>
    <svg class="mtn mtn-near" data-depth="0.16" viewBox="0 0 1000 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="0,220 0,190 60,130 140,170 220,90 310,160 400,70 480,150 560,80 650,160 730,100 820,170 900,130 970,180 1000,160 1000,220" fill="#17223b"></polygon>
      <polygon points="203,106 220,90 238,110 220,100" fill="#f4f8fc" opacity="0.9"></polygon>
      <polygon points="380,88 400,70 421,92 400,82" fill="#f4f8fc" opacity="0.95"></polygon>
      <polygon points="542,96 560,80 579,100 560,90" fill="#f4f8fc" opacity="0.9"></polygon>
      <polygon points="712,118 730,100 749,122 730,112" fill="#f4f8fc" opacity="0.8"></polygon>
    </svg>
    <canvas id="snowCanvas" aria-hidden="true"></canvas>
  </div>

  <div class="climb-track" aria-hidden="true"><div class="climb-marker" id="climbMarker">🚩</div></div>

  <div class="content">
    <div class="eyebrow" id="dateLabel">Loading…</div>
    <h1>Spiritual Progress Tracker</h1>
    <div class="sub" id="windowLabel"></div>
    <div id="loading">Loading today's data…</div>
    <div id="app" style="display:none;">

      <div class="card" id="progressCard">
        <h2>Today's Progress</h2>
        <span id="overallPct">0%</span>
        <div class="progress-bar"><div class="progress-fill" id="overallFill" style="width:0%;"></div></div>
        <div class="chips" id="chipRow"></div>
      </div>

      <div class="card">
        <h2>First Batch — Today's Message</h2>
        <div class="msg" id="set1Message"></div>
        <div class="check">
          <input type="checkbox" id="set1Done">
          <label for="set1Done" style="margin:0;">Listened to it</label>
        </div>
      </div>

      <div class="card">
        <h2>Second Batch — Current Message</h2>
        <span class="pill" id="set2Pill"></span>
        <div class="msg" id="set2Message" style="margin-top:6px;"></div>
        <label>Minutes listened today</label>
        <input type="number" id="set2Minutes" min="0">
        <label>Notes</label>
        <input type="text" id="set2Notes" placeholder="optional">
        <button class="secondary" onclick="advanceSet2()">Mark finished → move to next message</button>
      </div>

      <div class="card">
        <h2>Read Rhapsody</h2>
        <div class="check">
          <input type="checkbox" id="rhapsodyDone">
          <label for="rhapsodyDone" style="margin:0;">Read today's Rhapsody</label>
        </div>
        <label>Notes</label>
        <input type="text" id="rhapsodyNotes" placeholder="optional">
      </div>

      <div class="card">
        <h2>Bible Reading Plan</h2>
        <div class="row">
          <div>
            <label>Month</label>
            <input type="number" id="bibleMonth" min="1">
          </div>
          <div>
            <label>Week</label>
            <input type="number" id="bibleWeek" min="1">
          </div>
          <div>
            <label>Day</label>
            <input type="number" id="bibleDay" min="1">
          </div>
        </div>
        <button class="secondary" onclick="updateBiblePointer()">Update position</button>
        <div class="check">
          <input type="checkbox" id="bibleDone">
          <label for="bibleDone" style="margin:0;">Read today's portion</label>
        </div>
      </div>

      <div class="card">
        <h2>Prayer — <span id="phaseLabel"></span></h2>
        <div class="progress-bar"><div class="progress-fill" id="prayerBar" style="width:0%;"></div></div>
        <div class="sub" id="prayerSummary" style="margin-top:6px;"></div>

        <label>Morning (<span id="tMorning"></span> min target)</label>
        <input type="number" id="pMorning" min="0">

        <label>Evening (<span id="tEvening"></span> min target)</label>
        <input type="number" id="pEvening" min="0">

        <div id="fridayRow" style="display:none;">
          <label>Friday Night Prayer (<span id="tFriday"></span> min target)</label>
          <input type="number" id="pFriday" min="0">
        </div>

        <div id="saturdayRow" style="display:none;">
          <label>Saturday Night Prayer (<span id="tSaturday"></span> min target)</label>
          <input type="number" id="pSaturday" min="0">
        </div>

        <label>Campus prayer & prophesying (<span id="tCampus"></span> min target)</label>
        <input type="number" id="pCampus" min="0">
      </div>

      <div class="card">
        <h2>Notes</h2>
        <input type="text" id="dayNotes" placeholder="anything worth remembering about today">
        <button onclick="saveAll()">Save now</button>
        <div id="status">Everything above saves automatically as you go.</div>
      </div>

      <div class="card">
        <h2>Last 14 Days</h2>
        <table id="historyTable">
          <thead><tr><th>Date</th><th>Set1</th><th>Set2 min</th><th>Rhapsody</th><th>Prayer</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    var latest = null;
    var saveTimer = null;
    var saving = false;
    var dirtyWhileSaving = false;
    var AUTOSAVE_DEBOUNCE_MS = 800;
    var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var revealInitialized = false;

    function load() {
      google.script.run.withSuccessHandler(onLoaded).clientGetToday();
      google.script.run.withSuccessHandler(onHistory).clientGetHistory(14);
    }

    function onLoaded(ctx) {
      latest = ctx;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('dateLabel').textContent = ctx.dayName;
      document.getElementById('windowLabel').textContent = ctx.inWindow ? '' : 'Outside the Sep 3 – Oct 31 tracking window';

      document.getElementById('set1Message').textContent = ctx.set1Message;
      document.getElementById('set1Done').checked = ctx.set1Done;

      document.getElementById('set2Pill').textContent = 'Message ' + ctx.set2Index + ' of ' + ctx.set2Total;
      document.getElementById('set2Message').textContent = ctx.set2Message;
      document.getElementById('set2Minutes').value = ctx.set2MinutesLogged || '';
      document.getElementById('set2Notes').value = ctx.set2Notes || '';

      document.getElementById('rhapsodyDone').checked = ctx.rhapsodyDone;
      document.getElementById('rhapsodyNotes').value = ctx.rhapsodyNotes || '';

      document.getElementById('bibleMonth').value = ctx.bibleMonth;
      document.getElementById('bibleWeek').value = ctx.bibleWeek;
      document.getElementById('bibleDay').value = ctx.bibleDay;
      document.getElementById('bibleDone').checked = ctx.bibleDone;

      var t = ctx.prayerTargets;
      document.getElementById('phaseLabel').textContent = ctx.phaseLabel;
      document.getElementById('tMorning').textContent = t.morning;
      document.getElementById('tEvening').textContent = t.evening;
      document.getElementById('tCampus').textContent = t.campus;
      document.getElementById('pMorning').value = ctx.prayerLogged.morning || '';
      document.getElementById('pEvening').value = ctx.prayerLogged.evening || '';
      document.getElementById('pCampus').value = ctx.prayerLogged.campus || '';

      if (t.fridayNight > 0) {
        document.getElementById('fridayRow').style.display = 'block';
        document.getElementById('tFriday').textContent = t.fridayNight;
        document.getElementById('pFriday').value = ctx.prayerLogged.friday || '';
      }
      if (t.saturdayNight > 0) {
        document.getElementById('saturdayRow').style.display = 'block';
        document.getElementById('tSaturday').textContent = t.saturdayNight;
        document.getElementById('pSaturday').value = ctx.prayerLogged.saturday || '';
      }

      var pct = t.total > 0 ? Math.min(100, Math.round(100 * ctx.prayerLogged.total / t.total)) : 0;
      document.getElementById('prayerBar').style.width = pct + '%';
      document.getElementById('prayerSummary').textContent =
        ctx.prayerLogged.total + ' / ' + t.total + ' minutes logged today (' + pct + '%)';

      document.getElementById('dayNotes').value = ctx.notes || '';
      updateProgressUI();

      // Wire scroll-reveal exactly once, right as the cards actually become
      // visible for the first time — not on a guessed timeout, which would
      // race the network round trip and could flash already-shown cards.
      if (!revealInitialized) { revealInitialized = true; initReveal(); }
    }

    // ---- Live "Today's Progress" summary — recomputed from the DOM on
    // every keystroke/click, so it moves instantly without waiting on a
    // server round trip. ---------------------------------------------------
    function updateProgressUI() {
      if (!latest) return;
      var set1Done = document.getElementById('set1Done').checked;
      var set2Started = Number(document.getElementById('set2Minutes').value || 0) > 0;
      var rhapsodyDone = document.getElementById('rhapsodyDone').checked;
      var bibleDone = document.getElementById('bibleDone').checked;

      var t = latest.prayerTargets;
      var prayerTotal = Number(document.getElementById('pMorning').value || 0) +
        Number(document.getElementById('pEvening').value || 0) +
        Number(document.getElementById('pCampus').value || 0) +
        Number((document.getElementById('pFriday') || {}).value || 0) +
        Number((document.getElementById('pSaturday') || {}).value || 0);
      var prayerPct = t.total > 0 ? Math.min(100, Math.round(100 * prayerTotal / t.total)) : 0;

      // reflect the live prayer total on its own bar too, not just the overall one
      document.getElementById('prayerBar').style.width = prayerPct + '%';
      document.getElementById('prayerSummary').textContent =
        prayerTotal + ' / ' + t.total + ' minutes logged today (' + prayerPct + '%)';

      var parts = [
        { label: 'First Batch', done: set1Done },
        { label: 'Second Batch', done: set2Started },
        { label: 'Rhapsody', done: rhapsodyDone },
        { label: 'Bible', done: bibleDone },
        { label: 'Prayer ' + prayerPct + '%', done: prayerPct >= 100, pct: prayerPct }
      ];
      var sum = (set1Done ? 100 : 0) + (set2Started ? 100 : 0) + (rhapsodyDone ? 100 : 0) +
        (bibleDone ? 100 : 0) + prayerPct;
      var overall = Math.round(sum / parts.length);

      document.getElementById('overallPct').textContent = overall + '%';
      document.getElementById('overallFill').style.width = overall + '%';

      var marker = document.getElementById('climbMarker');
      if (marker) marker.style.bottom = overall + '%';

      var chipRow = document.getElementById('chipRow');
      chipRow.innerHTML = '';
      parts.forEach(function (p) {
        var chip = document.createElement('span');
        chip.className = 'chip' + (p.done ? ' done' : '');
        chip.textContent = (p.done ? '✓ ' : '') + p.label;
        chipRow.appendChild(chip);
      });
    }

    // ---- Autosave --------------------------------------------------------
    // Any change recomputes the progress summary immediately (client-side,
    // instant) and schedules a save to the sheet shortly after (debounced
    // for typing, so we're not hammering the server on every keystroke).
    function onFieldChange() {
      updateProgressUI();
      scheduleAutosave();
    }

    function scheduleAutosave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(persist, AUTOSAVE_DEBOUNCE_MS);
    }

    function persist() {
      saveTimer = null; // the scheduled save (if any) is the one running now
      if (saving) { dirtyWhileSaving = true; return; }
      saving = true;
      var statusEl = document.getElementById('status');
      statusEl.textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (ctx) {
          latest = ctx; // keep targets etc. current without re-touching form fields the user is mid-edit on
          saving = false;
          statusEl.textContent = 'Saved ✓ · ' + new Date().toLocaleTimeString();
          google.script.run.withSuccessHandler(onHistory).clientGetHistory(14);
          if (dirtyWhileSaving) { dirtyWhileSaving = false; scheduleAutosave(); }
        })
        .withFailureHandler(function (err) {
          saving = false;
          statusEl.textContent = 'Could not save — will retry (' + err.message + ')';
          scheduleAutosave();
        })
        .clientSaveLog(collectEntry());
    }

    function wireAutosave() {
      var ids = [
        'set1Done', 'set2Minutes', 'set2Notes', 'rhapsodyDone', 'rhapsodyNotes',
        'bibleMonth', 'bibleWeek', 'bibleDay', 'bibleDone',
        'pMorning', 'pEvening', 'pFriday', 'pSaturday', 'pCampus', 'dayNotes'
      ];
      ids.forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        var evt = (el.type === 'checkbox') ? 'change' : 'input';
        el.addEventListener(evt, onFieldChange);
      });
    }

    // Catch up with the sheet if this tab was left open and another device
    // (or the reminder-email link opened elsewhere) logged something since —
    // only when there's nothing unsaved sitting in the debounce window.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !saveTimer && !saving) {
        load();
      }
    });

    function onHistory(rows) {
      var tbody = document.querySelector('#historyTable tbody');
      tbody.innerHTML = '';
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + r.date + '</td><td>' + (r.set1Done === 'Yes' ? '✅' : '—') + '</td>' +
          '<td>' + (r.set2Minutes || 0) + '</td><td>' + (r.rhapsodyDone === 'Yes' ? '✅' : '—') + '</td>' +
          '<td>' + (r.prayerTotal || 0) + '/' + (r.prayerTarget || 0) + '</td>';
        tbody.appendChild(tr);
      });
    }

    function collectEntry() {
      return {
        set1Message: latest.set1Message,
        set1Done: document.getElementById('set1Done').checked,
        set2Message: latest.set2Message,
        set2Minutes: document.getElementById('set2Minutes').value,
        set2Notes: document.getElementById('set2Notes').value,
        rhapsodyDone: document.getElementById('rhapsodyDone').checked,
        rhapsodyNotes: document.getElementById('rhapsodyNotes').value,
        bibleMonth: document.getElementById('bibleMonth').value,
        bibleWeek: document.getElementById('bibleWeek').value,
        bibleDay: document.getElementById('bibleDay').value,
        bibleDone: document.getElementById('bibleDone').checked,
        prayerMorning: document.getElementById('pMorning').value,
        prayerEvening: document.getElementById('pEvening').value,
        prayerFriday: document.getElementById('pFriday') ? document.getElementById('pFriday').value : 0,
        prayerSaturday: document.getElementById('pSaturday') ? document.getElementById('pSaturday').value : 0,
        prayerCampus: document.getElementById('pCampus').value,
        notes: document.getElementById('dayNotes').value
      };
    }

    function saveAll() {
      if (saveTimer) clearTimeout(saveTimer);
      persist();
    }

    function advanceSet2() {
      google.script.run.withSuccessHandler(onLoaded).clientAdvanceSet2();
    }

    function updateBiblePointer() {
      var m = document.getElementById('bibleMonth').value;
      var w = document.getElementById('bibleWeek').value;
      var d = document.getElementById('bibleDay').value;
      google.script.run.withSuccessHandler(onLoaded).clientSetBiblePointer(m, w, d);
    }

    // ======================================================================
    // Scene: parallax mountains, falling snow, scroll reveal, and a small
    // snow-burst + glow when a box gets checked. Purely decorative/additive —
    // none of this touches the data flow above.
    // ======================================================================

    function initParallax() {
      if (reducedMotion) return;
      var layers = document.querySelectorAll('.mtn');
      var ticking = false;
      window.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          var y = window.scrollY;
          layers.forEach(function (el) {
            var depth = parseFloat(el.getAttribute('data-depth')) || 0;
            el.style.transform = 'translateY(' + (-y * depth) + 'px)';
          });
          ticking = false;
        });
      }, { passive: true });
    }

    function initReveal() {
      if (reducedMotion || !('IntersectionObserver' in window)) return;
      var cards = document.querySelectorAll('#app .card');
      cards.forEach(function (c) { c.classList.add('reveal'); });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      cards.forEach(function (c) { io.observe(c); });
    }

    function initSnow() {
      var canvas = document.getElementById('snowCanvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var flakes = [];
      var count = reducedMotion ? 0 : 44;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (var i = 0; i < count; i++) {
        flakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 1 + Math.random() * 2.2,
          speed: 0.3 + Math.random() * 0.9,
          drift: (Math.random() - 0.5) * 0.6,
          alpha: 0.3 + Math.random() * 0.5
        });
      }

      var running = document.visibilityState === 'visible';
      document.addEventListener('visibilitychange', function () {
        var wasRunning = running;
        running = document.visibilityState === 'visible';
        if (running && !wasRunning) requestAnimationFrame(tick);
      });

      function tick() {
        if (!running) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        flakes.forEach(function (f) {
          f.y += f.speed;
          f.x += f.drift;
          if (f.y > canvas.height) { f.y = -4; f.x = Math.random() * canvas.width; }
          if (f.x > canvas.width) f.x = 0;
          if (f.x < 0) f.x = canvas.width;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + f.alpha + ')';
          ctx.fill();
        });
        requestAnimationFrame(tick);
      }
      if (count > 0 && running) requestAnimationFrame(tick);
    }

    function spawnSnowBurst(x, y) {
      for (var i = 0; i < 7; i++) {
        var flake = document.createElement('span');
        flake.className = 'burst-flake';
        flake.textContent = '❄';
        var angle = (Math.PI * 2 * i) / 7 + Math.random() * 0.5;
        var dist = 24 + Math.random() * 26;
        flake.style.left = x + 'px';
        flake.style.top = y + 'px';
        flake.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        flake.style.setProperty('--dy', (Math.sin(angle) * dist - 20) + 'px');
        document.body.appendChild(flake);
        flake.addEventListener('animationend', function () { this.remove(); });
      }
    }

    function wireCelebrations() {
      if (reducedMotion) return;
      ['set1Done', 'rhapsodyDone', 'bibleDone'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('change', function () {
          if (!el.checked) return;
          var rect = el.getBoundingClientRect();
          spawnSnowBurst(rect.left + rect.width / 2, rect.top + window.scrollY);
          var card = el.closest('.card');
          if (card) {
            card.classList.add('glow-pulse');
            setTimeout(function () { card.classList.remove('glow-pulse'); }, 900);
          }
        });
      });
    }

    initParallax();
    initSnow();
    wireAutosave();
    wireCelebrations();
    load();
  </script>
</body>
</html>
