<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #131210;
      --surface: #1b1916;
      --surface-raised: #211e1a;
      --ink: #f2ede4;
      --ink-soft: #b6aa9c;
      --ink-faint: #7c7164;
      --border: rgba(242, 237, 228, 0.1);
      --field-bg: rgba(242, 237, 228, 0.045);
      --accent: #c9a463;
      --accent-strong: #e2c084;
      --focus-ring: #c9a463;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      font-family: "Manrope", -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    /* ---- ambient backdrop: grain + two slow breathing glows, nothing
       literal — restraint is the point. ---- */
    .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .glow { position: absolute; border-radius: 50%; filter: blur(30px); animation: breathe 16s ease-in-out infinite; }
    .glow-a { width: 520px; height: 520px; top: -12%; left: -14%; background: radial-gradient(circle, rgba(201,164,99,0.16), transparent 70%); }
    .glow-b { width: 460px; height: 460px; bottom: -16%; right: -12%; background: radial-gradient(circle, rgba(201,164,99,0.1), transparent 70%); animation-direction: reverse; animation-duration: 20s; }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.16); opacity: 0.55; } }
    .grain { position: fixed; inset: 0; z-index: 0; opacity: 0.035; mix-blend-mode: overlay; pointer-events: none; }

    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; }
    }

    /* ---- content ---- */
    .content { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 40px 20px 72px; }
    .eyebrow {
      font-family: "Manrope", sans-serif; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint);
    }
    h1 {
      font-family: "Bodoni Moda", Georgia, serif; font-weight: 600; font-style: italic;
      font-size: 1.9rem; margin: 8px 0 4px; color: var(--ink);
      letter-spacing: 0.005em;
    }
    .sub { color: var(--ink-soft); margin-top: 2px; font-size: 0.9rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      margin-top: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    }
    .card h2 {
      font-family: "Manrope", sans-serif; font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin: 0 0 14px; color: var(--ink-faint);
    }
    .card.reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.55s ease, transform 0.55s ease; }
    .card.reveal.in-view { opacity: 1; transform: translateY(0); }
    @keyframes glowPulse {
      0% { box-shadow: 0 12px 28px rgba(0,0,0,0.28), 0 0 0 rgba(201,164,99,0); }
      35% { box-shadow: 0 12px 28px rgba(0,0,0,0.28), 0 0 0 1px rgba(201,164,99,0.5), 0 0 24px rgba(201,164,99,0.25); }
      100% { box-shadow: 0 12px 28px rgba(0,0,0,0.28), 0 0 0 rgba(201,164,99,0); }
    }
    .card.glow-pulse { animation: glowPulse 1s ease-out; }

    label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-top: 12px; }
    input[type=number], input[type=text], select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      background: var(--field-bg); color: var(--ink);
      border-radius: 8px; font-size: 0.95rem; margin-top: 5px;
      font-family: "Manrope", sans-serif;
    }
    input[type=number] { font-variant-numeric: tabular-nums; }
    input:focus, select:focus {
      outline: none; border-color: var(--focus-ring);
      box-shadow: 0 0 0 3px rgba(201, 164, 99, 0.18);
    }
    input::placeholder { color: var(--ink-faint); }

    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .check { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .check input { width: 17px; height: 17px; accent-color: var(--accent); }

    button {
      background: var(--accent); color: #14120e; font-weight: 700;
      font-family: "Manrope", sans-serif; letter-spacing: 0.01em;
      border: none; border-radius: 8px; padding: 11px 18px; font-size: 0.88rem;
      cursor: pointer; margin-top: 14px;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    button:hover { background: var(--accent-strong); transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    button.secondary {
      background: transparent; color: var(--ink-soft);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: rgba(242,237,228,0.05); color: var(--ink); }

    .msg { font-weight: 600; color: var(--ink); font-size: 1.02rem; }
    .progress-bar { background: rgba(242,237,228,0.08); border-radius: 4px; height: 6px; overflow: hidden; margin-top: 8px; }
    .progress-fill { background: var(--accent); height: 100%; transition: width 0.4s ease; }
    .pill {
      display: inline-block; background: transparent; color: var(--ink-faint);
      border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px;
      font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); color: var(--ink-soft); }
    th { color: var(--ink-faint); font-weight: 600; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; }
    #status { font-size: 0.82rem; color: var(--ink-faint); margin-top: 10px; min-height: 1.2em; transition: opacity 0.3s; }
    #loading { text-align: center; padding: 48px; color: var(--ink-faint); font-size: 0.85rem; letter-spacing: 0.04em; }

    /* ---- today's progress ring ---- */
    .ring-wrap { position: relative; width: 136px; height: 136px; margin: 4px auto 14px; }
    .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: rgba(242,237,228,0.08); stroke-width: 6; }
    .ring-fill {
      fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round;
      stroke-dasharray: 326.7; stroke-dashoffset: 326.7;
      transition: stroke-dashoffset 0.6s ease;
    }
    .ring-center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #overallPct { font-family: "Bodoni Moda", serif; font-size: 1.9rem; font-weight: 600; color: var(--ink); }
    .ring-label { font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); margin-top: 2px; }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 4px; }
    .chip {
      background: transparent; color: var(--ink-faint); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 11px; font-size: 0.72rem; letter-spacing: 0.02em;
    }
    .chip.done { border-color: var(--accent); color: var(--accent-strong); }
  </style>
</head>
<body>

  <div class="ambient" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
  </div>
  <svg class="grain" aria-hidden="true">
    <filter id="grainFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter>
    <rect width="100%" height="100%" filter="url(#grainFilter)"></rect>
  </svg>

  <div class="content">
    <div class="eyebrow" id="dateLabel">Loading…</div>
    <h1>Spiritual Progress Tracker</h1>
    <div class="sub" id="windowLabel"></div>
    <div id="loading">Loading today's data…</div>
    <div id="app" style="display:none;">

      <div class="card" id="progressCard" style="text-align:center;">
        <h2>Today's Progress</h2>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-center">
            <span id="overallPct">0%</span>
            <span class="ring-label">today</span>
          </div>
        </div>
        <div class="chips" id="chipRow"></div>
      </div>

      <div class="card">
        <h2>First Batch — Today's Message</h2>
        <div class="msg" id="set1Message"></div>
        <div class="check">
          <input type="checkbox" id="set1Done">
          <label for="set1Done" style="margin:0;">Listened to it</label>
        </div>
      </div>

      <div class="card">
        <h2>Second Batch — Current Message</h2>
        <span class="pill" id="set2Pill"></span>
        <div class="msg" id="set2Message" style="margin-top:8px;"></div>
        <label>Minutes listened today</label>
        <input type="number" id="set2Minutes" min="0">
        <label>Notes</label>
        <input type="text" id="set2Notes" placeholder="optional">
        <button class="secondary" onclick="advanceSet2()">Mark finished → move to next message</button>
      </div>

      <div class="card">
        <h2>Read Rhapsody</h2>
        <div class="check">
          <input type="checkbox" id="rhapsodyDone">
          <label for="rhapsodyDone" style="margin:0;">Read today's Rhapsody</label>
        </div>
        <label>Notes</label>
        <input type="text" id="rhapsodyNotes" placeholder="optional">
      </div>

      <div class="card">
        <h2>Bible Reading Plan</h2>
        <div class="row">
          <div>
            <label>Month</label>
            <input type="number" id="bibleMonth" min="1">
          </div>
          <div>
            <label>Week</label>
            <input type="number" id="bibleWeek" min="1">
          </div>
          <div>
            <label>Day</label>
            <input type="number" id="bibleDay" min="1">
          </div>
        </div>
        <button class="secondary" onclick="updateBiblePointer()">Update position</button>
        <div class="check">
          <input type="checkbox" id="bibleDone">
          <label for="bibleDone" style="margin:0;">Read today's portion</label>
        </div>
      </div>

      <div class="card">
        <h2>Prayer — <span id="phaseLabel"></span></h2>
        <div class="progress-bar"><div class="progress-fill" id="prayerBar" style="width:0%;"></div></div>
        <div class="sub" id="prayerSummary" style="margin-top:8px;"></div>

        <label>Morning (<span id="tMorning"></span> min target)</label>
        <input type="number" id="pMorning" min="0">

        <label>Evening (<span id="tEvening"></span> min target)</label>
        <input type="number" id="pEvening" min="0">

        <div id="fridayRow" style="display:none;">
          <label>Friday Night Prayer (<span id="tFriday"></span> min target)</label>
          <input type="number" id="pFriday" min="0">
        </div>

        <div id="saturdayRow" style="display:none;">
          <label>Saturday Night Prayer (<span id="tSaturday"></span> min target)</label>
          <input type="number" id="pSaturday" min="0">
        </div>

        <label>Campus prayer & prophesying (<span id="tCampus"></span> min target)</label>
        <input type="number" id="pCampus" min="0">
      </div>

      <div class="card">
        <h2>Notes</h2>
        <input type="text" id="dayNotes" placeholder="anything worth remembering about today">
        <button onclick="saveAll()">Save now</button>
        <div id="status">Everything above saves automatically as you go.</div>
      </div>

      <div class="card">
        <h2>Last 14 Days</h2>
        <table id="historyTable">
          <thead><tr><th>Date</th><th>Set1</th><th>Set2 min</th><th>Rhapsody</th><th>Prayer</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    var latest = null;
    var saveTimer = null;
    var saving = false;
    var dirtyWhileSaving = false;
    var AUTOSAVE_DEBOUNCE_MS = 800;
    var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var revealInitialized = false;
    var RING_CIRCUMFERENCE = 2 * Math.PI * 52;

    function load() {
      google.script.run.withSuccessHandler(onLoaded).clientGetToday();
      google.script.run.withSuccessHandler(onHistory).clientGetHistory(14);
    }

    function onLoaded(ctx) {
      latest = ctx;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('dateLabel').textContent = ctx.dayName;
      document.getElementById('windowLabel').textContent = ctx.inWindow ? '' : 'Outside the Sep 3 – Oct 31 tracking window';

      document.getElementById('set1Message').textContent = ctx.set1Message;
      document.getElementById('set1Done').checked = ctx.set1Done;

      document.getElementById('set2Pill').textContent = 'Message ' + ctx.set2Index + ' of ' + ctx.set2Total;
      document.getElementById('set2Message').textContent = ctx.set2Message;
      document.getElementById('set2Minutes').value = ctx.set2MinutesLogged || '';
      document.getElementById('set2Notes').value = ctx.set2Notes || '';

      document.getElementById('rhapsodyDone').checked = ctx.rhapsodyDone;
      document.getElementById('rhapsodyNotes').value = ctx.rhapsodyNotes || '';

      document.getElementById('bibleMonth').value = ctx.bibleMonth;
      document.getElementById('bibleWeek').value = ctx.bibleWeek;
      document.getElementById('bibleDay').value = ctx.bibleDay;
      document.getElementById('bibleDone').checked = ctx.bibleDone;

      var t = ctx.prayerTargets;
      document.getElementById('phaseLabel').textContent = ctx.phaseLabel;
      document.getElementById('tMorning').textContent = t.morning;
      document.getElementById('tEvening').textContent = t.evening;
      document.getElementById('tCampus').textContent = t.campus;
      document.getElementById('pMorning').value = ctx.prayerLogged.morning || '';
      document.getElementById('pEvening').value = ctx.prayerLogged.evening || '';
      document.getElementById('pCampus').value = ctx.prayerLogged.campus || '';

      if (t.fridayNight > 0) {
        document.getElementById('fridayRow').style.display = 'block';
        document.getElementById('tFriday').textContent = t.fridayNight;
        document.getElementById('pFriday').value = ctx.prayerLogged.friday || '';
      }
      if (t.saturdayNight > 0) {
        document.getElementById('saturdayRow').style.display = 'block';
        document.getElementById('tSaturday').textContent = t.saturdayNight;
        document.getElementById('pSaturday').value = ctx.prayerLogged.saturday || '';
      }

      var pct = t.total > 0 ? Math.min(100, Math.round(100 * ctx.prayerLogged.total / t.total)) : 0;
      document.getElementById('prayerBar').style.width = pct + '%';
      document.getElementById('prayerSummary').textContent =
        ctx.prayerLogged.total + ' / ' + t.total + ' minutes logged today (' + pct + '%)';

      document.getElementById('dayNotes').value = ctx.notes || '';
      updateProgressUI();

      // Wire scroll-reveal exactly once, right as the cards actually become
      // visible for the first time — not on a guessed timeout, which would
      // race the network round trip and could flash already-shown cards.
      if (!revealInitialized) { revealInitialized = true; initReveal(); }
    }

    // ---- Live "Today's Progress" summary — recomputed from the DOM on
    // every keystroke/click, so it moves instantly without waiting on a
    // server round trip. ---------------------------------------------------
    function updateProgressUI() {
      if (!latest) return;
      var set1Done = document.getElementById('set1Done').checked;
      var set2Started = Number(document.getElementById('set2Minutes').value || 0) > 0;
      var rhapsodyDone = document.getElementById('rhapsodyDone').checked;
      var bibleDone = document.getElementById('bibleDone').checked;

      var t = latest.prayerTargets;
      var prayerTotal = Number(document.getElementById('pMorning').value || 0) +
        Number(document.getElementById('pEvening').value || 0) +
        Number(document.getElementById('pCampus').value || 0) +
        Number((document.getElementById('pFriday') || {}).value || 0) +
        Number((document.getElementById('pSaturday') || {}).value || 0);
      var prayerPct = t.total > 0 ? Math.min(100, Math.round(100 * prayerTotal / t.total)) : 0;

      // reflect the live prayer total on its own bar too, not just the overall one
      document.getElementById('prayerBar').style.width = prayerPct + '%';
      document.getElementById('prayerSummary').textContent =
        prayerTotal + ' / ' + t.total + ' minutes logged today (' + prayerPct + '%)';

      var parts = [
        { label: 'First Batch', done: set1Done },
        { label: 'Second Batch', done: set2Started },
        { label: 'Rhapsody', done: rhapsodyDone },
        { label: 'Bible', done: bibleDone },
        { label: 'Prayer ' + prayerPct + '%', done: prayerPct >= 100, pct: prayerPct }
      ];
      var sum = (set1Done ? 100 : 0) + (set2Started ? 100 : 0) + (rhapsodyDone ? 100 : 0) +
        (bibleDone ? 100 : 0) + prayerPct;
      var overall = Math.round(sum / parts.length);

      document.getElementById('overallPct').textContent = overall + '%';
      var ringFill = document.getElementById('ringFill');
      if (ringFill) ringFill.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - overall / 100);

      var chipRow = document.getElementById('chipRow');
      chipRow.innerHTML = '';
      parts.forEach(function (p) {
        var chip = document.createElement('span');
        chip.className = 'chip' + (p.done ? ' done' : '');
        chip.textContent = (p.done ? '✓ ' : '') + p.label;
        chipRow.appendChild(chip);
      });
    }

    // ---- Autosave --------------------------------------------------------
    // Any change recomputes the progress summary immediately (client-side,
    // instant) and schedules a save to the sheet shortly after (debounced
    // for typing, so we're not hammering the server on every keystroke).
    function onFieldChange() {
      updateProgressUI();
      scheduleAutosave();
    }

    function scheduleAutosave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(persist, AUTOSAVE_DEBOUNCE_MS);
    }

    function persist() {
      saveTimer = null; // the scheduled save (if any) is the one running now
      if (saving) { dirtyWhileSaving = true; return; }
      saving = true;
      var statusEl = document.getElementById('status');
      statusEl.textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (ctx) {
          latest = ctx; // keep targets etc. current without re-touching form fields the user is mid-edit on
          saving = false;
          statusEl.textContent = 'Saved · ' + new Date().toLocaleTimeString();
          google.script.run.withSuccessHandler(onHistory).clientGetHistory(14);
          if (dirtyWhileSaving) { dirtyWhileSaving = false; scheduleAutosave(); }
        })
        .withFailureHandler(function (err) {
          saving = false;
          statusEl.textContent = 'Could not save — will retry (' + err.message + ')';
          scheduleAutosave();
        })
        .clientSaveLog(collectEntry());
    }

    function wireAutosave() {
      var ids = [
        'set1Done', 'set2Minutes', 'set2Notes', 'rhapsodyDone', 'rhapsodyNotes',
        'bibleMonth', 'bibleWeek', 'bibleDay', 'bibleDone',
        'pMorning', 'pEvening', 'pFriday', 'pSaturday', 'pCampus', 'dayNotes'
      ];
      ids.forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        var evt = (el.type === 'checkbox') ? 'change' : 'input';
        el.addEventListener(evt, onFieldChange);
      });
    }

    // Catch up with the sheet if this tab was left open and another device
    // (or the reminder-email link opened elsewhere) logged something since —
    // only when there's nothing unsaved sitting in the debounce window.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !saveTimer && !saving) {
        load();
      }
    });

    function onHistory(rows) {
      var tbody = document.querySelector('#historyTable tbody');
      tbody.innerHTML = '';
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + r.date + '</td><td>' + (r.set1Done === 'Yes' ? '✓' : '—') + '</td>' +
          '<td>' + (r.set2Minutes || 0) + '</td><td>' + (r.rhapsodyDone === 'Yes' ? '✓' : '—') + '</td>' +
          '<td>' + (r.prayerTotal || 0) + '/' + (r.prayerTarget || 0) + '</td>';
        tbody.appendChild(tr);
      });
    }

    function collectEntry() {
      return {
        set1Message: latest.set1Message,
        set1Done: document.getElementById('set1Done').checked,
        set2Message: latest.set2Message,
        set2Minutes: document.getElementById('set2Minutes').value,
        set2Notes: document.getElementById('set2Notes').value,
        rhapsodyDone: document.getElementById('rhapsodyDone').checked,
        rhapsodyNotes: document.getElementById('rhapsodyNotes').value,
        bibleMonth: document.getElementById('bibleMonth').value,
        bibleWeek: document.getElementById('bibleWeek').value,
        bibleDay: document.getElementById('bibleDay').value,
        bibleDone: document.getElementById('bibleDone').checked,
        prayerMorning: document.getElementById('pMorning').value,
        prayerEvening: document.getElementById('pEvening').value,
        prayerFriday: document.getElementById('pFriday') ? document.getElementById('pFriday').value : 0,
        prayerSaturday: document.getElementById('pSaturday') ? document.getElementById('pSaturday').value : 0,
        prayerCampus: document.getElementById('pCampus').value,
        notes: document.getElementById('dayNotes').value
      };
    }

    function saveAll() {
      if (saveTimer) clearTimeout(saveTimer);
      persist();
    }

    function advanceSet2() {
      google.script.run.withSuccessHandler(onLoaded).clientAdvanceSet2();
    }

    function updateBiblePointer() {
      var m = document.getElementById('bibleMonth').value;
      var w = document.getElementById('bibleWeek').value;
      var d = document.getElementById('bibleDay').value;
      google.script.run.withSuccessHandler(onLoaded).clientSetBiblePointer(m, w, d);
    }

    // ---- Scroll reveal + a restrained completion cue (a quiet gold outline
    // pulse on the card, nothing more) — decorative/additive only. --------
    function initReveal() {
      if (reducedMotion || !('IntersectionObserver' in window)) return;
      var cards = document.querySelectorAll('#app .card');
      cards.forEach(function (c) { c.classList.add('reveal'); });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      cards.forEach(function (c) { io.observe(c); });
    }

    function wireCompletionCue() {
      if (reducedMotion) return;
      ['set1Done', 'rhapsodyDone', 'bibleDone'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('change', function () {
          if (!el.checked) return;
          var card = el.closest('.card');
          if (card) {
            card.classList.add('glow-pulse');
            setTimeout(function () { card.classList.remove('glow-pulse'); }, 1000);
          }
        });
      });
    }

    wireAutosave();
    wireCompletionCue();
    load();
  </script>
</body>
</html>
